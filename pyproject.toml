[tool.poetry]
name = "py-msgpack-rpc"
version = "0.1.0a2"
description = "An RPC library implementing MessagePack RPC in Python."
authors = ["Kenta Kabashima <kenta_program37@hotmail.co.jp>"]
license = "MIT"
readme = "README.md"
homepage = "https://gitlab.com/MusicScience37Projects/utility-libraries/py-msgpack-rpc"
repository = "https://gitlab.com/MusicScience37Projects/utility-libraries/py-msgpack-rpc.git"
#documentation = "TODO"
#keywords = ["TODO"]
# Classifiers: https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
msgpack = ">=1.2.1"
typing-extensions = ">=4.16.0"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pre-commit = "^4.6.0"
pylint = "^4.0.6"
mypy = "^2.3.0"
flake8 = "^7.3.0"
isort = "^8.0.1"
pydocstyle = "^6.3.0"
pytest = "^9.1.1"
pytest-cov = "^7.1.0"
pytest-asyncio = "^1.4.0"

[tool.poetry.group.doc.dependencies]
toml = "^0.10.2"
types-toml = "^0.10.8.20260518"
Sphinx = "^9.1.0"
doc8 = "^2.0.0"
sphinx-autobuild = "^2025.8.25"
sphinx-orange-book-theme = "^0.21.0"
myst-parser = "^5.1.0"

[tool.isort]
profile = "black"

[tool.pydocstyle]
convention = "google"
add-ignore = "D107"

[tool.pylint.main]
disable = "too-many-instance-attributes,line-too-long,fixme"
load-plugins = "pylint.extensions.docparams"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
